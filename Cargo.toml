[package]
name = "kokoro-tiny"
version = "0.1.0"
edition = "2021"
autobins = false
autoexamples = false
authors = ["Hue & Aye <team@8b.is>"]
description = "Minimal TTS crate using Kokoro - perfect for embedding in other apps"
license = "Apache-2.0"
homepage = "https://github.com/8b-is/kokoro-tiny"
repository = "https://github.com/8b-is/kokoro-tiny"
documentation = "https://docs.rs/kokoro-tiny"
readme = "README.md"
keywords = ["tts", "text-to-speech", "kokoro", "audio", "voice"]
categories = ["multimedia::audio", "multimedia", "command-line-utilities"]
exclude = ["model.safetensors", "voices/", "*.wav", "*.mp3", "*.opus", "*.flac", "target/", ".git/", ".DS_Store"]

[dependencies]
kokoro-tts = { path = "../candle-kokoro", default-features = false }
candle-core = "0.10.2"

# Essential for audio
hound = "3.5.1"  # WAV support built-in

# Async constructor compatibility
tokio = { version = "1.45", features = ["fs", "rt"] }

audio_sample = { path = "../audio_samples", version = "2.0.0", default-features = false}
fdk-aac = { path = "../fdk-aac-rs", version = "0.8.0", default-features = false}

# Optional features
mp3lame-encoder = { version = "0.2", optional = true }
cpal = { version = "0.15", optional = true }
rodio = { version = "0.19", optional = true }
audiopus = { version = "0.2", optional = true }
threadpool = "1.8.1"
lockfree = "0.5.1"
tracing = "0.1.41"
num-traits = "0.2.19"

[features]
default = ["playback"]
mp3 = ["mp3lame-encoder"]
cuda = ["kokoro-tts/cuda", "candle-core/cuda"]
playback = ["cpal", "rodio"]
opus-format = ["audiopus"]
all-formats = ["mp3", "opus-format"]

[[example]]
name = "candle_smoke"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
